components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token JWT con ruoli e, per gli espositori, `exhibitor_id`.

  parameters:
    EditionIdPath:
      name: editionId
      in: path
      required: true
      schema:
        type: integer
    EditionIdQuery:
      name: editionId
      in: query
      required: true
      schema:
        type: integer
    EditionIdOptional:
      name: editionId
      in: query
      required: false
      schema:
        type: integer
    ExhibitorIdPath:
      name: exhibitorId
      in: path
      required: true
      schema:
        type: integer
    QuoteIdPath:
      name: quoteId
      in: path
      required: true
      schema:
        type: integer
    ContractIdPath:
      name: contractId
      in: path
      required: true
      schema:
        type: integer
    PreemptionIdPath:
      name: preemptionId
      in: path
      required: true
      schema:
        type: integer
    BatchIdPath:
      name: batchId
      in: path
      required: true
      schema:
        type: integer
    Page:
      name: page
      in: query
      description: Numero di pagina, da 0
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      description: Elementi per pagina
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 20
    Sort:
      name: sort
      in: query
      description: 'Campo e verso, es. `legalName,asc`. Solo campi dichiarati ordinabili; altri danno 400.'
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Identificativo univoco scelto dal client (UUID). Una ripetizione con la stessa chiave restituisce la prima risposta senza duplicare l'operazione. Valida 24 ore.
      schema:
        type: string
        minLength: 8
        maxLength: 64
    RowVersionHeader:
      name: If-Match
      in: header
      required: true
      description: '`rowVersion` letto dalla risorsa. Se e'' cambiato nel frattempo la risposta e'' `409 OPTIMISTIC_LOCK_CONFLICT`.'
      schema:
        type: integer

  responses:
    Unauthorized:
      description: Token mancante o non valido (`UNAUTHENTICATED`)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Ruolo non autorizzato (`FORBIDDEN`)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Risorsa inesistente oppure non visibile a questo utente (`NOT_FOUND`)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Conflitto di stato o di concorrenza (es. `STAND_ALREADY_SOLD`, `OPTIMISTIC_LOCK_CONFLICT`, `IMPORT_ALREADY_DONE`)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unprocessable:
      description: Dati validi come formato ma non ammessi dalle regole (`VALIDATION_ERROR`, `PAYMENT_EXCEEDS_CONTRACT`, `PREEMPTION_EXPIRED`, ...)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PayloadTooLarge:
      description: Troppi elementi o file troppo grande (`PAYLOAD_TOO_LARGE`)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: Limite di richieste superato (`RATE_LIMITED`); l'header `Retry-After` indica quando riprovare
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    # ---------- Generali ----------
    Problem:
      type: object
      required: [title, status, code]
      properties:
        type:
          type: string
          example: about:blank
        title:
          type: string
          example: Stand gia' venduto
        status:
          type: integer
          example: 409
        code:
          type: string
          description: Codice stabile per i client. Non cambia tra versioni compatibili.
          example: STAND_ALREADY_SOLD
        detail:
          type: string
        traceId:
          type: string
          description: Identificativo per ritrovare la richiesta nei log
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
    FieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
          example: lines[0].quantity
        message:
          type: string
    PageInfo:
      type: object
      required: [page, size, totalElements, totalPages]
      properties:
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [UP, DOWN]
    CurrentUser:
      type: object
      required: [username, roles]
      properties:
        username:
          type: string
        displayName:
          type: string
        roles:
          type: array
          items:
            type: string
            enum: [ADMIN, COMMERCIAL, OPS, EXHIBITOR, SCANNER, BI_READER]
        exhibitorId:
          type: integer
          nullable: true

    # ---------- Enumerazioni ----------
    EditionStatus:
      type: string
      enum: [PLANNED, SALES_OPEN, RUNNING, CLOSED]
    StandStatus:
      type: string
      enum: [AVAILABLE, RESERVED, SOLD, FREE, NOT_SELLABLE]
    PositionType:
      type: string
      enum: [LINEA, ANGOLO, PENISOLA, ISOLA]
    QuoteStatus:
      type: string
      enum: [DRAFT, SENT, CONFIRMED, REJECTED, EXPIRED, CONVERTED]
    ContractStatus:
      type: string
      enum: [DRAFT, SIGNED, CANCELLED]
    LineType:
      type: string
      enum: [SPACE, SURCHARGE, EXTRA, SPONSORSHIP]
    ItemType:
      type: string
      enum: [SPACE, SURCHARGE, SPONSORSHIP, EXTRA]
    PriceUnit:
      type: string
      enum: [SQM, PCT_OF_SPACE, PACKAGE, EACH]
    PaymentKind:
      type: string
      enum: [DEPOSIT, BALANCE, REFUND]
    PaymentState:
      type: string
      enum: [DUE, OVERDUE, PAID, PAID_LATE]
    SponsorshipStatus:
      type: string
      enum: [SOLD, DELIVERED, CANCELLED]
    PreemptionStatus:
      type: string
      enum: [OPEN, EXERCISED, EXPIRED, WAIVED]
    ReadingResult:
      type: string
      enum: [OK, KO]
    Direction:
      type: string
      enum: [IN, OUT, UNKNOWN]
    Severity:
      type: string
      enum: [INFO, WARNING, ERROR, CRITICAL]
    ResolutionStatus:
      type: string
      enum: [OPEN, ACKNOWLEDGED, RESOLVED, WONT_FIX]
    AnomalyAction:
      type: string
      enum: [NONE, LOADED_FLAGGED, AUTO_CORRECTED, QUARANTINED, REJECTED]
    QuarantineStatus:
      type: string
      enum: [PENDING, RELEASED, DISCARDED]
    ImportStatus:
      type: string
      enum: [RUNNING, COMPLETED, COMPLETED_WITH_ISSUES, FAILED, SUPERSEDED]
    SourceCode:
      type: string
      enum: [XLSX_COMMERCIALE, BIGL_2024, BIGL_2025, TORN_2024, TORN_2025, LEAD_2025, VISITE_2025]
    Money:
      type: number
      format: double
      description: Euro, IVA esclusa, arrotondato a due decimali dal server
      example: 10945.9

    # ---------- Anagrafiche ----------
    EditionDay:
      type: object
      properties:
        dayDate:
          type: string
          format: date
        dayNumber:
          type: integer
        opensAt:
          type: string
          example: '09:00'
        closesAt:
          type: string
          example: '17:30'
    Edition:
      type: object
      properties:
        editionId:
          type: integer
        year:
          type: integer
        name:
          type: string
        status:
          $ref: '#/components/schemas/EditionStatus'
        timezone:
          type: string
          example: Europe/Rome
        days:
          type: array
          items:
            $ref: '#/components/schemas/EditionDay'
    Pavilion:
      type: object
      properties:
        pavilionId:
          type: integer
        code:
          type: string
          example: P1
        name:
          type: string
    ExhibitorCategory:
      type: object
      properties:
        categoryId:
          type: integer
        name:
          type: string
    Geometry:
      type: object
      nullable: true
      description: Coordinate nella planimetria. Null finche' il cliente non fornisce la pianta.
      properties:
        x:
          type: number
        y:
          type: number
        width:
          type: number
        height:
          type: number
    ExhibitorRef:
      type: object
      nullable: true
      description: Visibile solo a ADMIN e COMMERCIAL
      properties:
        exhibitorId:
          type: integer
