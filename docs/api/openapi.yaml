openapi: 3.0.3
info:
  title: ARCADE Milano API
  version: 1.0.0-draft
  description: |
    Contratto API condiviso tra BID e BAD. **BOZZA: non ancora congelata e non ancora implementata.**
    Nessun endpoint di questo file esiste oggi nel backend.

    Convenzioni principali (dettagli in `docs/api/README.md`):
    - Base `/api/v1`. Date `YYYY-MM-DD`; istanti in UTC (`...Z`). Importi in euro, IVA esclusa, due decimali.
    - L'autorizzazione e' sempre decisa dal server in base al token (ruoli in `x-roles`); il client non e' mai fidato.
    - Errori nel formato `application/problem+json` con un `code` stabile.
    - Le POST che creano contratti, pagamenti o dati acquisiti richiedono l'header `Idempotency-Key`.
    - Le misure di visitatori sono distinte (venduti, validati, passaggi, ingressi-giorno) e le presenze sono sempre STIMATE.
  contact:
    name: Team BID
servers:
  - url: http://localhost:8080/api/v1
    description: Sviluppo locale
security:
  - bearerAuth: []
tags:
  - name: Sistema
  - name: Anagrafiche
  - name: Espositori
  - name: Preventivi
  - name: Contratti
  - name: Pagamenti
  - name: Sponsorizzazioni
  - name: Prelazioni
  - name: Acquisizione dati
  - name: Operativo
  - name: KPI
  - name: Importazioni e qualita
  - name: Portale espositore

paths:
  /health:
    get:
      tags: [Sistema]
      operationId: getHealth
      summary: Stato del servizio
      security: []
      x-roles: [PUBLIC]
      responses:
        '200':
          description: Servizio attivo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /me:
    get:
      tags: [Sistema]
      operationId: getCurrentUser
      summary: Utente corrente e ruoli
      x-roles: [ADMIN, COMMERCIAL, OPS, EXHIBITOR, SCANNER, BI_READER]
      responses:
        '200':
          description: Utente autenticato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /editions:
    get:
      tags: [Anagrafiche]
      operationId: listEditions
      summary: Elenco edizioni
      x-roles: [ADMIN, COMMERCIAL, OPS, EXHIBITOR]
      responses:
        '200':
          description: Edizioni ordinate per anno
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Edition'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /editions/{editionId}:
    get:
      tags: [Anagrafiche]
      operationId: getEdition
      summary: Dettaglio edizione con giorni di apertura
      x-roles: [ADMIN, COMMERCIAL, OPS, EXHIBITOR]
      parameters:
        - $ref: '#/components/parameters/EditionIdPath'
      responses:
        '200':
          description: Edizione
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Edition'
        '404':
          $ref: '#/components/responses/NotFound'
  /pavilions:
    get:
      tags: [Anagrafiche]
      operationId: listPavilions
      summary: Elenco padiglioni
      x-roles: [ADMIN, COMMERCIAL, OPS, EXHIBITOR]
      responses:
        '200':
          description: Padiglioni
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pavilion'
  /exhibitor-categories:
    get:
      tags: [Anagrafiche]
      operationId: listExhibitorCategories
      summary: Categorie di espositore
      x-roles: [ADMIN, COMMERCIAL, OPS]
      responses:
        '200':
          description: Categorie
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExhibitorCategory'
  /editions/{editionId}/floorplan:
    get:
      tags: [Anagrafiche]
      operationId: getFloorplan
      summary: Planimetria dell'edizione con stato commerciale degli stand
      description: |
        Stand raggruppati per padiglione. Le coordinate (`geometry`) sono `null` finche' il cliente non fornisce la planimetria.
        Lo `exhibitor` e' valorizzato solo per ADMIN e COMMERCIAL; agli altri ruoli il server lo omette.
      x-roles: [ADMIN, COMMERCIAL, OPS]
      parameters:
        - $ref: '#/components/parameters/EditionIdPath'
      responses:
        '200':
          description: Planimetria
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Floorplan'
        '404':
          $ref: '#/components/responses/NotFound'
  /editions/{editionId}/stands:
    get:
      tags: [Anagrafiche]
      operationId: listStands
      summary: Stand dell'edizione, filtrabili
      x-roles: [ADMIN, COMMERCIAL, OPS]
      parameters:
        - $ref: '#/components/parameters/EditionIdPath'
        - name: pavilionCode
          in: query
          schema:
            type: string
            example: P1
        - name: commercialStatus
          in: query
          schema:
            $ref: '#/components/schemas/StandStatus'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: Pagina di stand
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandEditionPage'
  /editions/{editionId}/price-list:
    get:
      tags: [Anagrafiche]
      operationId: getPriceList
      summary: Listino dell'edizione
      x-roles: [ADMIN, COMMERCIAL, OPS]
      parameters:
        - $ref: '#/components/parameters/EditionIdPath'
      responses:
        '200':
          description: Listino con voci e condizioni
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceList'
        '404':
          $ref: '#/components/responses/NotFound'
  /price-items/{priceItemId}:
    patch:
      tags: [Anagrafiche]
      operationId: updatePriceItem
      summary: Modifica una voce di listino
      description: Solo listini non ancora usati da contratti firmati. L'operazione e' registrata nell'audit.
      x-roles: [ADMIN]
      parameters:
        - name: priceItemId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PriceItemUpdate'
      responses:
        '200':
          description: Voce aggiornata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceItem'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /exhibitors:
    get:
      tags: [Espositori]
      operationId: listExhibitors
      summary: Elenco espositori
      x-roles: [ADMIN, COMMERCIAL, OPS]
      parameters:
        - name: q
          in: query
          description: Ricerca su ragione sociale o codice
          schema:
            type: string
        - name: categoryId
          in: query
          schema:
            type: integer
        - name: editionId
          in: query
          description: Se presente, solo gli espositori con contratto firmato in quell'edizione
          schema:
            type: integer
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: Pagina di espositori
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExhibitorPage'
    post:
      tags: [Espositori]
      operationId: createExhibitor
      summary: Crea un espositore
      x-roles: [ADMIN, COMMERCIAL]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExhibitorInput'
      responses:
        '201':
          description: Espositore creato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exhibitor'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /exhibitors/{exhibitorId}:
    parameters:
      - $ref: '#/components/parameters/ExhibitorIdPath'
    get:
      tags: [Espositori]
      operationId: getExhibitor
      summary: Dettaglio espositore
      x-roles: [ADMIN, COMMERCIAL, OPS]
      responses:
        '200':
          description: Espositore
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exhibitor'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Espositori]
      operationId: updateExhibitor
      summary: Aggiorna un espositore
      x-roles: [ADMIN, COMMERCIAL]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExhibitorInput'
      responses:
        '200':
          description: Espositore aggiornato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exhibitor'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /exhibitors/{exhibitorId}/report:
    get:
      tags: [Espositori]
      operationId: getExhibitorReport
      summary: Report individuale dell'espositore (vista staff)
      x-roles: [ADMIN, COMMERCIAL]
      parameters:
        - $ref: '#/components/parameters/ExhibitorIdPath'
        - name: editionId
          in: query
          description: Se assente, tutte le edizioni
          schema:
            type: integer
      responses:
        '200':
          description: Report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExhibitorReport'
        '404':
          $ref: '#/components/responses/NotFound'

  /quotes:
    get:
      tags: [Preventivi]
      operationId: listQuotes
      summary: Elenco preventivi
      x-roles: [ADMIN, COMMERCIAL]
      parameters:
        - name: editionId
          in: query
          schema:
            type: integer
        - name: exhibitorId
          in: query
          schema:
            type: integer
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/QuoteStatus'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: Pagina di preventivi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuotePage'
    post:
      tags: [Preventivi]
      operationId: createQuote
      summary: Crea un preventivo in bozza
      description: |
        Il server calcola prezzi, maggiorazioni (angolo/penisola/isola), sconto e totali dal listino dell'edizione:
        i prezzi inviati dal client NON sono accettati. Gli stand indicati passano a `RESERVED` con scadenza.
        Se uno stand non e' disponibile: `409 STAND_ALREADY_RESERVED` o `STAND_ALREADY_SOLD`.
      x-roles: [ADMIN, COMMERCIAL]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuoteCreate'
      responses:
        '201':
          description: Preventivo creato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quote'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /quotes/{quoteId}:
    get:
      tags: [Preventivi]
      operationId: getQuote
      summary: Dettaglio preventivo
      x-roles: [ADMIN, COMMERCIAL]
      parameters:
        - $ref: '#/components/parameters/QuoteIdPath'
      responses:
        '200':
          description: Preventivo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quote'
        '404':
          $ref: '#/components/responses/NotFound'
  /quotes/{quoteId}/send:
    post:
      tags: [Preventivi]
      operationId: sendQuote
      summary: Segna il preventivo come inviato (DRAFT -> SENT)
      x-roles: [ADMIN, COMMERCIAL]
      parameters:
        - $ref: '#/components/parameters/QuoteIdPath'
        - $ref: '#/components/parameters/RowVersionHeader'
      responses:
        '200':
          description: Preventivo aggiornato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quote'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /quotes/{quoteId}/confirm:
    post:
      tags: [Preventivi]
      operationId: confirmQuote
      summary: Conferma il preventivo (SENT -> CONFIRMED)
      x-roles: [ADMIN, COMMERCIAL]
      parameters:
        - $ref: '#/components/parameters/QuoteIdPath'
        - $ref: '#/components/parameters/RowVersionHeader'
      responses:
        '200':
          description: Preventivo confermato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quote'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /quotes/{quoteId}/reject:
    post:
      tags: [Preventivi]
      operationId: rejectQuote
      summary: Rifiuta o annulla il preventivo e libera gli stand riservati
      x-roles: [ADMIN, COMMERCIAL]
      parameters:
        - $ref: '#/components/parameters/QuoteIdPath'
        - $ref: '#/components/parameters/RowVersionHeader'
      responses:
        '200':
          description: Preventivo rifiutato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quote'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /quotes/{quoteId}/contract:
    post:
      tags: [Preventivi]
      operationId: convertQuoteToContract
      summary: Converte un preventivo confermato in contratto
      description: |
        Operazione transazionale: assegna gli stand (un solo contratto attivo per stand ed edizione), crea le righe,
        il piano di pagamento (acconto e saldo) e imposta gli stand a `SOLD`.
        Con la stessa `Idempotency-Key` la risposta e' quella della prima chiamata.
      x-roles: [ADMIN, COMMERCIAL]
      parameters:
        - $ref: '#/components/parameters/QuoteIdPath'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContractFromQuote'
      responses:
        '201':
          description: Contratto creato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contract'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /contracts:
    get:
      tags: [Contratti]
      operationId: listContracts
      summary: Elenco contratti
      x-roles: [ADMIN, COMMERCIAL, OPS]
      parameters:
        - name: editionId
          in: query
          schema:
            type: integer
        - name: exhibitorId
          in: query
          schema:
            type: integer
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/ContractStatus'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: Pagina di contratti
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractPage'
  /contracts/{contractId}:
    get:
      tags: [Contratti]
      operationId: getContract
      summary: Dettaglio contratto con stand, righe e pagamenti
      x-roles: [ADMIN, COMMERCIAL, OPS]
      parameters:
        - $ref: '#/components/parameters/ContractIdPath'
      responses:
        '200':
          description: Contratto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contract'
        '404':
          $ref: '#/components/responses/NotFound'
  /contracts/{contractId}/cancel:
    post:
      tags: [Contratti]
      operationId: cancelContract
      summary: Annulla il contratto e libera gli stand
      description: Gli stand tornano disponibili. I pagamenti gia' incassati restano registrati, e i rimborsi sono pagamenti di tipo REFUND.
      x-roles: [ADMIN]
      parameters:
        - $ref: '#/components/parameters/ContractIdPath'
        - $ref: '#/components/parameters/RowVersionHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContractCancel'
      responses:
        '200':
          description: Contratto annullato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contract'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /contracts/{contractId}/payments:
    parameters:
      - $ref: '#/components/parameters/ContractIdPath'
    get:
      tags: [Pagamenti]
      operationId: listContractPayments
      summary: Piano e stato dei pagamenti del contratto
      x-roles: [ADMIN, COMMERCIAL]
      responses:
        '200':
          description: Pagamenti
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Payment'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Pagamenti]
      operationId: registerPayment
      summary: Registra un pagamento (acconto, saldo o rimborso)
      description: |
        Acconto e saldo aggiornano la riga gia' prevista dal piano; il rimborso crea una nuova riga.
        La somma incassata non puo' superare il valore netto del contratto (`422 PAYMENT_EXCEEDS_CONTRACT`).
        Un pagamento e' un incasso, NON un ricavo aggiuntivo.
      x-roles: [ADMIN, COMMERCIAL]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentCreate'
      responses:
        '201':
          description: Pagamento registrato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /sponsorships:
    get:
      tags: [Sponsorizzazioni]
      operationId: listSponsorships
      summary: Sponsorizzazioni vendute
      x-roles: [ADMIN, COMMERCIAL, OPS]
      parameters:
        - name: editionId
          in: query
          schema:
            type: integer
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/SponsorshipStatus'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Pagina di sponsorizzazioni
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SponsorshipPage'
  /sponsorships/{sponsorshipId}:
    patch:
      tags: [Sponsorizzazioni]
      operationId: updateSponsorship
      summary: Aggiorna lo stato di esecuzione di una sponsorizzazione
      description: Non modifica gli importi, perché il valore economico resta nella riga contratto.
      x-roles: [ADMIN, COMMERCIAL]
      parameters:
        - name: sponsorshipId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SponsorshipUpdate'
      responses:
        '200':
          description: Sponsorizzazione aggiornata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sponsorship'
        '404':
          $ref: '#/components/responses/NotFound'

  /pre-emptions:
    get:
      tags: [Prelazioni]
      operationId: listPreemptions
      summary: Diritti di prelazione
      x-roles: [ADMIN, COMMERCIAL]
      parameters:
        - name: forEditionId
          in: query
          schema:
            type: integer
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/PreemptionStatus'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Pagina di prelazioni
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreemptionPage'
  /pre-emptions/{preemptionId}/exercise:
    post:
      tags: [Prelazioni]
      operationId: exercisePreemption
      summary: Esercita la prelazione
      description: Crea un preventivo in bozza sullo stesso stand per l'edizione successiva, se la scadenza non e' passata (`422 PREEMPTION_EXPIRED`).
      x-roles: [ADMIN, COMMERCIAL]
      parameters:
        - $ref: '#/components/parameters/PreemptionIdPath'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Preventivo in bozza creato dalla prelazione
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quote'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /pre-emptions/{preemptionId}/waive:
    post:
      tags: [Prelazioni]
      operationId: waivePreemption
      summary: Registra la rinuncia alla prelazione
      x-roles: [ADMIN, COMMERCIAL]
      parameters:
        - $ref: '#/components/parameters/PreemptionIdPath'
      responses:
        '200':
          description: Prelazione aggiornata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Preemption'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /ingest/gate-readings:
    post:
      tags: [Acquisizione dati]
      operationId: ingestGateReadings
      summary: Acquisisce un blocco di letture ai tornelli
      description: |
        Massimo 1000 letture per chiamata. Ogni lettura ha una `sourceRowKey` univoca per sorgente:
        le letture gia' ricevute sono contate come duplicate, non reinserite. Codici biglietto sconosciuti
        vengono caricati e segnalati come anomalia, mai scartati.
      x-roles: [SCANNER, OPS, ADMIN]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GateReadingBatch'
      responses:
        '200':
          description: Esito dell'acquisizione
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestResult'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /ingest/stand-visits:
    post:
      tags: [Acquisizione dati]
      operationId: ingestStandVisits
      summary: Acquisisce visite agli stand (app di scansione)
      description: |
        Massimo 500 visite per chiamata. `visitUuid` e' generato dal client e rende l'invio ripetibile senza duplicati
        (utile con rete instabile). Una visita NON e' un contatto qualificato.
      x-roles: [SCANNER, OPS, ADMIN]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StandVisitBatch'
      responses:
        '200':
          description: Esito dell'acquisizione
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestResult'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /ops/overview:
    get:
      tags: [Operativo]
      operationId: getEventOverview
      summary: Stato dell'evento per la dashboard staff
      description: Contiene `isDemo` e `lastUpdatedAt`, cosi' l'interfaccia puo' distinguere dati reali, simulati e aggiornamento.
      x-roles: [OPS, ADMIN, COMMERCIAL]
      parameters:
        - $ref: '#/components/parameters/EditionIdQuery'
      responses:
        '200':
          description: Panoramica
          content:
            application/json:
