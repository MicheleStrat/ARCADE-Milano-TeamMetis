      description: Registra utente e data. I dati originali non vengono modificati o cancellati.
      x-roles: [ADMIN, OPS]
      parameters:
        - name: anomalyId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnomalyResolution'
      responses:
        '200':
          description: Anomalia aggiornata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Anomaly'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /quarantine:
