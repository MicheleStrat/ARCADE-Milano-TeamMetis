      x-roles: [ADMIN, OPS]
      parameters:
        - $ref: '#/components/parameters/BatchIdPath'
      responses:
        '202':
          description: Rielaborazione accettata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportBatch'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /anomalies:
    get:
