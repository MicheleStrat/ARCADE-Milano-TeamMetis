  /imports:
    get:
      tags: [Importazioni e qualita]
      operationId: listImports
      summary: Elenco importazioni
      x-roles: [ADMIN, OPS]
      parameters:
        - name: sourceCode
          in: query
          schema:
            $ref: '#/components/schemas/SourceCode'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/ImportStatus'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Pagina di importazioni
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportBatchPage'
    post:
      tags: [Importazioni e qualita]
      operationId: createImport
      summary: Avvia l'importazione di un file
      description: |
        Il file e' identificato dalla sua impronta SHA-256: lo stesso file non viene mai importato due volte.
        Se e' gia' stato importato la risposta e' `409 IMPORT_ALREADY_DONE` con il batch esistente; per rielaborarlo
        usare `POST /imports/{batchId}/rerun`. L'elaborazione e' asincrona (`202`).
      x-roles: [ADMIN, OPS]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [sourceCode, file]
              properties:
                sourceCode:
                  $ref: '#/components/schemas/SourceCode'
                file:
                  type: string
                  format: binary
      responses:
        '202':
          description: Importazione accettata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportBatch'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /imports/{batchId}:
