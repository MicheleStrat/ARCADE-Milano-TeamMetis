                $ref: '#/components/schemas/EventOverview'
  /ops/presence:
    get:
      tags: [Operativo]
      operationId: getPresenceEstimate
      summary: Presenze STIMATE per padiglione
      description: |
        Metodo finestra di permanenza: un biglietto e' presente in un padiglione se ha una lettura OK a un suo varco
        negli ultimi `dwellMinutes`. Non esistono uscite nei dati: e' una stima, mai un conteggio certo.
        I padiglioni non vanno sommati; la serie con `pavilionCode = null` e' il totale evento con biglietti distinti.
      x-roles: [OPS, ADMIN, COMMERCIAL]
      parameters:
        - $ref: '#/components/parameters/EditionIdQuery'
        - name: dwellMinutes
          in: query
          schema:
            type: integer
            minimum: 15
            maximum: 360
            default: 90
        - name: bucketMinutes
          in: query
          schema:
            type: integer
            minimum: 5
            maximum: 60
            default: 15
        - name: day
          in: query
          description: Giorno (locale) da restituire; se assente tutti
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Serie di presenze stimate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresenceEstimate'
  /ops/stand-visits:
    get:
      tags: [Operativo]
      operationId: listStandVisits
      summary: Visite agli stand per ora
      description: Una sola sorgente per cella stand/giorno/ora (app oppure aggregato orario), mai somma cieca.
      x-roles: [OPS, ADMIN, COMMERCIAL]
      parameters:
        - $ref: '#/components/parameters/EditionIdQuery'
